<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JUST IN 新游戏推荐 · 交互原型</title>
<style>
:root{color-scheme:dark;--bg:#11131b;--panel:#1b1e29;--line:#34394b;--ink:#f7f7fb;--muted:#a8adbb;--yellow:#ffdc4d;--violet:#8b6bff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 65% 0,#2a2549,#11131b 48%);color:var(--ink);font:14px/1.5 Inter,"Microsoft YaHei",sans-serif}button,select{font:inherit}button{cursor:pointer}.layout{max-width:1120px;margin:auto;padding:26px;display:grid;grid-template-columns:270px 390px 270px;justify-content:center;gap:24px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;align-self:start}.eyebrow{color:var(--yellow);font-size:11px;letter-spacing:.17em;text-transform:uppercase}h1{font-size:27px;line-height:1.2;margin:8px 0 12px}h2{font-size:17px;margin:8px 0 14px}.muted,.hint{color:var(--muted);font-size:12px}.group{margin-top:21px}.group b{display:block;margin-bottom:9px}.action,select{width:100%;padding:11px 13px;margin:4px 0;background:#292d3c;border:1px solid #484e62;border-radius:11px;color:var(--ink);text-align:left;min-height:44px}.action:hover{border-color:var(--yellow)}.action:disabled{opacity:.42;cursor:default}.action.primary{background:var(--yellow);color:#221e0f;border-color:var(--yellow);font-weight:800}.status{margin-top:16px;padding:13px;background:#252a38;border-radius:13px;font-size:12px}.status strong{display:block;color:var(--yellow);margin-bottom:4px}.status span{color:#c9ccda}.log{padding-left:19px;color:#adb2c0;font-size:11px;max-height:142px;overflow:auto}.log li{margin:5px 0}.phone{height:844px;width:390px;max-width:100%;background:#141720;border:7px solid #34394b;border-radius:38px;position:relative;overflow:hidden;box-shadow:0 24px 70px #0009}.screen{height:100%;overflow:auto;padding:27px 18px 94px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:23px;font-weight:1000;letter-spacing:-.07em}.logo span{color:var(--yellow)}.icon{border:1px solid #414554;border-radius:50%;padding:7px 12px}.hello{color:#aaaebd;margin:30px 0 4px}.headline{font-size:30px;line-height:1.06;margin:0 0 24px;letter-spacing:-.05em}.feature{background:linear-gradient(125deg,#4a3a8e,#292251);border-radius:20px;padding:15px;display:flex;align-items:center;gap:12px;margin:0 0 23px}.feature .art{width:78px;height:78px;flex:none}.feature b{font-size:15px}.feature p{color:#d6d0f2;font-size:11px;margin:5px 0}.feature button,.modal .go{border:0;background:var(--yellow);color:#1f1d13;border-radius:9px;padding:8px 12px;font-weight:800}.section{display:flex;justify-content:space-between;align-items:end;margin:21px 0 10px}.section h2{margin:0}.section small{color:#a8adbb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.game{display:block;background:none;border:0;text-align:left;color:#fff;padding:0;min-width:0}.art{height:135px;display:flex;align-items:center;justify-content:center;font-size:61px;border-radius:16px;position:relative;overflow:hidden}.art.purple{background:linear-gradient(145deg,#7654db,#302267)}.art.blue{background:linear-gradient(145deg,#3e8dde,#1d356a)}.art.green{background:linear-gradient(145deg,#67ba81,#254b45)}.art.pink{background:linear-gradient(145deg,#ef8eaf,#71376a)}.pill{position:absolute;top:8px;left:8px;background:var(--yellow);color:#1c1a12;border-radius:6px;font-weight:900;font-size:10px;padding:3px 7px;letter-spacing:.04em}.pill.new{background:#f7f7fb}.game b{display:block;margin-top:7px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:#1c202c;border-top:1px solid #353947;padding:8px 8px 13px}.nav button{width:33.33%;border:0;background:none;color:#9aa0b1;font-size:12px;min-height:47px}.nav button.active{color:var(--yellow)}.nav i{display:block;font-size:20px;font-style:normal}.overlay{position:absolute;inset:0;background:#080a13bc;display:flex;align-items:center;justify-content:center;padding:22px;z-index:3}.modal{background:#252438;border:1px solid #77709a;border-radius:24px;padding:23px 20px 20px;text-align:center;width:100%;box-shadow:0 20px 60px #0008}.modal .hero{height:148px;border-radius:17px;background:linear-gradient(145deg,#7654db,#302267);display:grid;place-items:center;font-size:76px;position:relative}.modal .hero .pill{font-size:12px}.modal h2{font-size:23px;margin:17px 0 6px}.modal p{font-size:13px;color:#d2cfe2;margin:0 0 18px}.modal .go{display:block;width:100%;min-height:45px;margin-top:9px}.modal .cancel{display:block;width:100%;min-height:45px;margin-top:9px;border:1px solid #77709a;background:transparent;color:var(--ink);border-radius:9px;font-weight:800}.play-screen{text-align:center;padding-top:160px}.play-screen .big{font-size:100px}.play-screen button{background:var(--yellow);border:0;border-radius:10px;padding:12px 19px;margin-top:20px}.rule{border-top:1px solid var(--line);padding:11px 0;font-size:12px;color:#c0c4d0}.rule b{color:#fff;display:block;margin-bottom:3px}@media(max-width:1020px){.layout{grid-template-columns:270px 390px}.rules{grid-column:1/-1}}@media(max-width:720px){.layout{display:flex;flex-direction:column;align-items:center;padding:12px}.phone{order:0}.controls{order:1;width:min(390px,100%)}.rules{order:2;width:min(390px,100%)}}
</style><style>.layout{max-width:754px;grid-template-columns:270px 390px}.nav button{width:50%}.controls button.action.selected{background:var(--yellow);color:#221e0f;border-color:var(--yellow);font-weight:800}.controls button.action.selected:disabled{opacity:1}.text-action{display:block;width:100%;min-height:44px;margin-top:8px;border:0;background:none;color:#a8adbb;text-decoration:underline;text-underline-offset:4px;text-align:center}.text-action:hover{color:#fff}@media(max-width:720px){.layout{display:flex;flex-direction:column}}</style>
</head>
<body><main class="layout">
<section class="panel controls" aria-label="评审模拟控件">
<div class="group"><b>1 · 配置与下载</b><button class="action selected" id="config">默认状态</button><button class="action" id="complete">模拟下载成功</button><button class="action" id="invalidate">资源被删除</button></div>
<div class="group"><b>2 · 首页旅程</b><label class="action" style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="otherPopup">本次有其他弹窗需要展示</label><button class="action" id="guidePreview">查看首次引导弹窗</button><button class="text-action" id="reset">重置演示及弹窗记录</button></div>
</section>
<section class="phone" aria-label="手机原型"><div class="screen" id="screen"></div><nav class="nav" id="nav"><button data-nav="home" class="active"><i>⌂</i>Home</button><button data-nav="mine"><i>♡</i>My Games</button></nav><div id="dialogMount"></div></section>
</main><script>
(()=>{
const key='topya_just_in_guide_color_orbit_v1';const $=id=>document.getElementById(id);
let state={tagged:true,download:'queued',page:'home',popup:false,otherPopup:false,otherPopupOpen:false,game:'',shown:localStorage.getItem(key)==='1',note:'Remote Config 已标记 JUST IN，已自动加入优先预加载队列。'};
const gameReady=()=>state.download==='ready';
const pinned=()=>state.tagged&&gameReady();
const ready=()=>pinned();
const guideEligible=()=>pinned()&&gameReady()&&!state.shown;
function log(){}
function selectAction(id){const button=$(id);button.closest('.group').querySelectorAll('button.action').forEach(item=>item.classList.remove('selected'));button.classList.add('selected')}
function art(emoji,kind,badge=''){return `<div class="art ${kind}">${badge?`<span class="pill">${badge}</span>`:''}<span aria-hidden="true">${emoji}</span></div>`}
function card(name,emoji,kind,badge='',id=''){return `<button class="game" data-game="${id||name}">${art(emoji,kind,badge)}<b>${name}</b></button>`}
function cards(){const candidate=card('Color Orbit','🧩','purple',state.tagged?'JUST IN':'','color');const base=[card('Arrow Puzzle','➤','blue'),card('Monkey Mart','🐵','green'),card('Tile Master','◈','pink')];return ready()?candidate+base.join(''):base.join('')+candidate}
function header(){return `<header class="top"><div class="logo">TOP<span>YA!</span></div><span class="icon">⌕</span></header>`}
function home(){return `<div class="section"><h2>Games for you</h2></div><div class="grid">${cards()}</div>`}
function mine(){return `${header()}<p class="hello">My Games</p><h1 class="headline">Play again.</h1><p class="hint">选择首页游戏即可开始体验。</p>`}
function game(){return `<div class="play-screen"><div class="big">${state.game==='color'?'🧩':'🎮'}</div><h1>${state.game==='color'?'Color Orbit':state.game}</h1><p>游戏演示画面</p><button data-action="back">返回首页</button></div>`}
function modal(){if(state.otherPopupOpen)return `<div class="overlay" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="otherDialogTitle"><h2 id="otherDialogTitle">其他弹窗（评审模拟）</h2><p>本次进入首页先展示其他弹窗，JUST IN 引导不弹出。</p><button class="go" data-action="closeOther">关闭</button></div></div>`;return state.popup?`<div class="overlay" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="hero">🧩<span class="pill">JUST IN</span></div><h2 id="dialogTitle">新游戏刚上线啦！</h2><p>全新乐趣，等你体验！</p><button class="go" data-action="startGuide">立即开始</button><button class="cancel" data-action="cancelGuide">取消</button></div></div>`:''}
function render(){let content=state.page==='home'?home():state.page==='mine'?mine():game();$('screen').innerHTML=content;$('dialogMount').innerHTML=modal();$('nav').style.display=state.page==='game'?'none':'flex';document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.page));$('complete').disabled=!state.tagged||ready();$('invalidate').disabled=!state.tagged;$('guidePreview').disabled=state.otherPopup}
function markGuideShown(){state.shown=true;localStorage.setItem(key,'1')}
function enter(){state.page='home';state.popup=false;state.otherPopupOpen=false;if(state.otherPopup){state.otherPopupOpen=true;state.note='先判断其他弹窗：本次展示其他弹窗，不展示 JUST IN 引导，也不计为已展示。';log(state.note)}else if(guideEligible()){state.popup=true;state.note='无其他弹窗，JUST IN 已置顶且就绪、引导未弹过：展示引导。';log(state.note)}else{state.note=pinned()?'无其他弹窗，但 JUST IN 引导已弹过：不再展示。':'无其他弹窗，但 JUST IN 未置顶或未就绪：不展示引导。'}render();if(state.popup&&$('dialogMount').querySelector('#dialogTitle'))markGuideShown()}
$('config').onclick=()=>{selectAction('config');state.tagged=true;state.download='queued';state.page='home';state.popup=false;state.otherPopup=false;state.otherPopupOpen=false;$('otherPopup').checked=false;state.note='默认状态：Color Orbit 显示 JUST IN，保持 Remote Config 默认第 4 位，自动进入优先预加载队列。';log(state.note);render()};
$('complete').onclick=()=>{selectAction('complete');state.download='ready';state.note='下载成功，首页置顶且显示 JUST IN；下一次自然进入首页再判断弹窗。';log(state.note);render()};
$('invalidate').onclick=()=>{selectAction('invalidate');state.download='queued';state.popup=false;state.note='资源被删除：游戏变为非置顶，需要重新下载；保留 JUST IN 标签并恢复默认顺序，重新加入优先预加载队列。';log(state.note);render()};
$('guidePreview').onclick=()=>{selectAction('guidePreview');state.tagged=true;state.download='ready';state.shown=false;localStorage.removeItem(key);state.note='评审预览：已准备好首次首页引导。';log(state.note);enter()};
$('otherPopup').onchange=e=>{state.otherPopup=e.target.checked;if(state.otherPopup&&state.popup){state.popup=false;state.note='有其他弹窗需要展示：撤下 JUST IN 引导，本次不计为已展示。';log(state.note)}else if(!state.otherPopup&&state.otherPopupOpen){state.otherPopupOpen=false;state.note='其他弹窗结束；本次首页停留中不补弹 JUST IN 引导。';log(state.note)}render()};
$('reset').onclick=()=>{localStorage.removeItem(key);state={tagged:true,download:'queued',page:'home',popup:false,otherPopup:false,otherPopupOpen:false,game:'',shown:false,note:'已重置。Remote Config 标记 JUST IN，自动进入优先预加载队列。'};$('otherPopup').checked=false;selectAction('config');$('guidePreview').classList.remove('selected');render()};
document.querySelector('.phone').onclick=e=>{const a=e.target.closest('[data-action]');if(a){if(a.dataset.action==='closeOther'){state.otherPopupOpen=false;state.otherPopup=false;$('otherPopup').checked=false;state.note='其他弹窗已关闭；本次不补弹 JUST IN 引导，下一次自然进入首页再判断。';log(state.note);render()}else if(a.dataset.action==='startGuide'){state.popup=false;state.game='color';state.page='game';render()}else if(a.dataset.action==='cancelGuide'){state.popup=false;render()}else if(a.dataset.action==='back')enter();return}const n=e.target.closest('[data-nav]');if(n){if(n.dataset.nav==='home')enter();else{state.page=n.dataset.nav;state.popup=false;state.otherPopupOpen=false;render()}return}const g=e.target.closest('[data-game]');if(g){if(g.dataset.game==='color'&&!ready()){state.note='Color Orbit 尚未下载完成，进入普通下载流程（原型仅演示提示）。';log(state.note);render();return}state.game=g.dataset.game;state.page='game';render()}};
log('配置已读取：Color Orbit 标记 JUST IN，尚未下载');render();
})();
</script></body></html>
