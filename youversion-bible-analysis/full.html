把事实、修辞和重复结构列出来"},{"id":"85e40c3d-0939-459f-ade9-8c7029731902","title":"语境：前后文和整卷书如何限制这一段的意思"},{"id":"17493e1a-7fc6-4d89-8112-7f0d4e7fd9a5","title":"背景：历史、地理与文化资料是否有可靠来源支持"},{"id":"269e655b-374d-4991-b0b4-40826808ac72","title":"互文：查找明确引用或主题相关经文，区分强关联与松散类比"},{"id":"04cbb92c-ad1d-4d19-a844-4f24e171b814","title":"解释：先给出段落原意，再列不同传统中有代表性的理解及争议点"},{"id":"652dd3c8-64e1-4c7b-ab33-bc50d2faef72","title":"应用：最后才转为今天读者的反思、行动和祷告建议"},{"id":"10556130-74d1-492b-9324-88c81084d335","title":"每一步保留经节和资料出处，避免从应用倒推经文本义"}]}},{"id":"6764946f-f24c-4e66-9d1c-77ca3440124a","title":"六、录屏案例：诗篇 139:23","children":{"attached":[{"id":"d32c8cb5-7960-4cc4-a886-ad0c3028e7bd","title":"输入：今日经文‘求你鉴察我，知道我的心思；试炼我，知道我的意念’"},{"id":"85b28325-41e7-4281-8785-586065b66e5f","title":"段落范围：至少连同 139:24 阅读，留意作者求引导的结尾"},{"id":"b0990207-384b-47c9-96cf-7cf127152b5b","title":"文本观察：两个并行请求，围绕心思与意念向神敞开"},{"id":"c4ea40c2-3ca8-4f21-af8e-b5fb45da0d6c","title":"理解主题：主动接受察看，并寻求认清隐藏的问题"},{"id":"57b7981d-3c5c-477e-903d-52c1d1a1be43","title":"灵修应用：反省内心、承认问题、以此经文祷告"},{"id":"e5664069-bbb6-4aab-aa58-b91333cb4472","title":"录屏实证：App 的绿色长文实际提供了主题解释、反思与祷告引导"},{"id":"abbb6d2a-5dfd-411a-992a-f6324fb0b62a","title":"方法示例：段落划分、原文词义和背景校勘属于通用释经流程；录屏未证明 App 内部逐步执行"}]}},{"id":"1187ddc1-1267-48dc-a0ff-b61c49f0b055","title":"七、YouVersion 页面如何呈现解读","children":{"attached":[{"id":"eac804c8-f150-4190-b5d7-7c534c016e8b","title":"经文卡片：先提供当天的经节和可分享入口"},{"id":"dd508e67-e232-49fc-bd85-37229811e471","title":"阅读整章：让用户回到章节上下文"},{"id":"6f0c6c5f-f583-445d-9c00-50ec877e6831","title":"译本对照：展示不同译本的措辞，用于辅助理解"},{"id":"85d400b0-0abf-4c11-a16f-845848be2802","title":"经文指引：以文章解释主题，再引到个人反思与祷告"},{"id":"cd4a71a4-495d-4fd1-b4fb-0afa34dbb217","title":"读经计划：把灵修和多条经文编排成每日任务"},{"id":"28cfebe5-d736-4761-8263-416830bb3cb9","title":"主题发掘：用用户关心的问题引导到相关计划与经文"},{"id":"ce27e4b2-e577-47a0-b66c-ae580e1cdadc","title":"录屏没有展示原文词典、重点词释义弹窗或其内部内容生产流程"}]}},{"id":"2399fe47-b937-4d53-baaf-2c984287e065","title":"八、AI 可参与的解读流程","children":{"attached":[{"id":"cf72311b-da92-4150-bb0a-a379fee6199f","title":"输入：经节范围、目标译本、用户问题和可合法使用的资料库"},{"id":"d0d63284-05ea-4159-bb6c-e5260ab85282","title":"检索：取整段上下文、授权注释、词典、相关经文及资料来源"},{"id":"dbe8f9b2-4c10-4470-8579-59b9e1210ac8","title":"拆解：提取文体、主旨、关键句、译文差异和待核实问题"},{"id":"05941331-88a0-42f5-b99b-8c843f4319eb","title":"生成：按‘经文本义/解释依据/不同观点/生活应用’分栏形成草稿"},{"id":"1e5bc082-3d3a-48be-b9ce-20f772c6588a","title":"校验：程序校对经文引用和译本归属；编辑校对释经与神学立场"},{"id":"1bef5ce3-e51b-4053-bbe6-26219329c0c6","title":"发布：保留来源、作者、审核人、版本及撤回机制"},{"id":"fb6aba9e-9173-4627-a5ef-e616b95bed75","title":"在线问答：遇到证据不足或教派分歧时展示不确定性，不给唯一确定答案"}]}},{"id":"2d9fcbfa-c529-4437-84ce-b45e869ade1e","title":"九、质量红线","children":{"attached":[{"id":"1e2f2ffa-11d1-4c81-b575-118486663c87","title":"不能凭单个重点词脱离段落推导整篇信息"},{"id":"5d222dd2-e4f8-40f3-8f2b-0e0bbfd5c4bc","title":"不能把一种教派观点伪装成所有基督徒的共同解释"},{"id":"faf00cf1-3575-4b27-93f5-f072257af1e5","title":"不能编造原文词义、历史背景、交叉经文或注释来源"},{"id":"588da63a-cb29-4345-b03e-2163a70eb72d","title":"不能把AI生成的祷告建议写成圣经原文"},{"id":"e8cc6179-7b4c-4c1f-9235-b3e29fd673da","title":"需要逐条检查引用经节、译本、上下文、版权和可追溯出处"}]}}]},"notes":{"plain":{"content":"通用释经方法、录屏可见的产品呈现、内部实现推断分别标注"}}}]}}</script>
<script>
(() => {
  const data=JSON.parse(document.getElementById('mindmap-data').textContent);
  const title=document.getElementById('title');title.textContent=data.title;
  document.getElementById('root').textContent=data.title;
  const branches=document.getElementById('branches');
  const notes=n=>{const plain=n.notes?.plain?.content;return typeof plain==='string'?plain:''};
  const kids=n=>n.children?.attached||[];
  const all=[];
  function build(n,depth,index){
    all.push(n);
    const children=kids(n), hasKids=children.length>0;
    const el=document.createElement(hasKids?'details':'div');
    el.className=depth===1?'branch':hasKids?'node':'leaf';
    if(depth===1){el.style.setProperty('--accent',['#117c70','#b46b42','#506b9f','#9a6b88','#658342','#ad8b43'][index%6]);}
    if(hasKids){
      if(depth===1)el.open=true;
      const summary=document.createElement('summary');
      const chev=document.createElement('span');chev.className='chev';chev.setAttribute('aria-hidden','true');summary.append(chev);
      if(depth===1){const num=document.createElement('span');num.className='index';num.textContent=String(index+1).padStart(2,'0');summary.append(num)}
      const label=document.createElement('span');label.className='label';label.textContent=n.title||'';summary.append(label);
      if(depth===1){const count=document.createElement('span');count.className='child-count';count.textContent=children.length+' 项';summary.append(count)}
      el.append(summary);
      const body=document.createElement('div');body.className=depth===1?'branch-body':'children';
      if(notes(n)){const note=document.createElement('div');note.className='note';note.textContent=notes(n);body.append(note)}
      const container=depth===1?document.createElement('div'):body;
      if(depth===1){container.className='children';body.append(container)}
      children.forEach((child,i)=>container.append(build(child,depth+1,i)));
      el.append(body);
    }else{el.textContent=n.title||'';if(notes(n)){const note=document.createElement('div');note.className='note';note.textContent=notes(n);el.append(note)}}
    el.dataset.text=((n.title||'')+' '+notes(n)).toLocaleLowerCase();
    return el;
  }
  kids(data).forEach((n,i)=>branches.append(build(n,1,i)));
  document.getElementById('count').textContent=kids(data).length+' 个一级主题 · '+(all.length+1)+' 个节点';
  document.getElementById('expand').onclick=()=>branches.querySelectorAll('details').forEach(x=>x.open=true);
  document.getElementById('collapse').onclick=()=>branches.querySelectorAll('details').forEach(x=>x.open=false);
  document.getElementById('print').onclick=()=>{branches.querySelectorAll('details').forEach(x=>x.open=true);window.print()};
  const search=document.getElementById('search');
  function filter(){
    const q=search.value.trim().toLocaleLowerCase();
    if(!q){branches.querySelectorAll('[hidden]').forEach(x=>x.hidden=false);branches.querySelectorAll('.branch').forEach(x=>x.open=true);document.getElementById('empty').style.display='none';return}
    function visit(el){const self=el.dataset.text.includes(q);let child=false;
      el.querySelectorAll(':scope > .branch-body > .children > .node, :scope > .branch-body > .children > .leaf, :scope > .children > .node, :scope > .children > .leaf').forEach(c=>{if(visit(c))child=true});
      el.hidden=!(self||child);if(child&&el.tagName==='DETAILS')el.open=true;return self||child;
    }
    let found=false;branches.querySelectorAll(':scope > .branch').forEach(el=>{if(visit(el))found=true});
    document.getElementById('empty').style.display=found?'none':'block';
  }
  search.addEventListener('input',filter);
})();
</script>
</body></html>
