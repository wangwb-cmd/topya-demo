const haloRegions=[
  {country:'新加坡',flag:'🇸🇬',nodes:[{name:'新加坡',city:'新加坡',ms:42}]},
  {country:'日本',flag:'🇯🇵',nodes:[{name:'日本 · 东京',city:'东京',ms:68},{name:'日本 · 大阪',city:'大阪',ms:74}]},
  {country:'美国',flag:'🇺🇸',nodes:[{name:'美国 · 洛杉矶',city:'洛杉矶',ms:126}]}
];
try{const saved=localStorage.getItem('halo.selectedRegion');if(saved){const region=haloRegions.find(r=>r.nodes.some(n=>n.name===saved));if(region){server={name:saved,flag:region.flag};regionConfirmed=true;$('server').textContent=server.name;$('flag').textContent=server.flag}}}catch(e){}
function clearTimers(){timers.forEach(clearTimeout);timers=[];clearInterval(tick)}
function setState(s){state=s;phone.dataset.state=s;const copy={idle:['轻触，即刻连接','','点击开关连接'],connecting:['正在建立安全连接','','连接中'],connected:['连接已保护','','点击开关断开'],failed:['连接没有完成','','点击开关重试']}[s];$('headline').textContent=copy[0];$('connect').setAttribute('aria-label',copy[2]);$('powerLabel').textContent=s==='connected'?'开启':s==='connecting'?'连接中':'关闭';$('hint').textContent=s==='connected'?'已连接 '+format(seconds)+' · ':s==='idle'?'':copy[2];$('halo').style.setProperty('--progress',s==='failed'?'18%':'0%')}
function format(v){return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}
function modal(title,body,buttons){$('sheetTitle').textContent=title;$('sheetBody').innerHTML=body;$('sheetActions').replaceChildren();buttons.forEach(([label,fn,primary])=>{const b=document.createElement('button');b.className='action'+(primary?' primary':'');b.textContent=label;b.onclick=fn;$('sheetActions').append(b)});$('sheet').classList.add('show')}
function close(){ $('sheet').classList.remove('show') }

function start(){
  close();if(!regionConfirmed)return;
  if(haloDeadline)remaining=Math.max(0,Math.ceil((haloDeadline-Date.now())/1000));$('remaining').textContent=format(remaining);
  if(!allowed){requestVpnPermission();return}
  if(remaining<=0){$('expire').click();return}
  clearTimers();setState('connecting');let p=0;
  const progress=setInterval(()=>$('halo').style.setProperty('--progress',Math.min(88,p+=9)+'%'),180);timers.push(progress);
  timers.push(setTimeout(()=>{
    clearInterval(progress);haloAttempts[server.name]=(haloAttempts[server.name]||0)+1;
    if(failNext||(server.name.includes('洛杉矶')&&haloAttempts[server.name]===1)){
      failNext=false;saveHistory({flag:server.flag,node:server.name,when:new Date().toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'}),duration:'00:00',result:'连接失败'});
      setState('failed');modal('连接失败','<p>'+server.name+' · 连接超时</p>',[['返回首页',()=>{adSeen=false;close()}],['换地区',choose],['重试',start,true]]);return
    }
    if(!haloDeadline)haloDeadline=Date.now()+remaining*1000;remaining=Math.max(0,Math.ceil((haloDeadline-Date.now())/1000));if(remaining===0){$('expire').click();return}seconds=0;setState('connected');modal('连接成功后广告','<p>连接已成功，正在展示本次广告。</p>',[['关闭广告',close,true]]);tick=setInterval(()=>{
      seconds++;remaining=Math.max(0,Math.ceil((haloDeadline-Date.now())/1000));$('hint').textContent='已连接 '+format(seconds)+' · ';$('remaining').textContent=format(remaining);
      if(remaining===0){saveHistory({flag:server.flag,node:server.name,when:new Date().toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'}),duration:'90:00',result:'时长结束'});clearTimers();adSeen=false;setState('idle');modal('本次时长已用完','<p>本次 90 分钟免费连接时长已用完，已断开连接。流量不限，重新连接可开启新会话。</p>',[['知道了',()=>{close();remaining=5400;haloDeadline=0;$('remaining').textContent='90:00';seconds=0},true]])}
    },1000)
  },2300))
}
function saveChannelHistory(){saveHistory({flag:server.flag,node:server.name,when:new Date().toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'}),duration:format(seconds),result:'已切换通道'})}
function requestVpnPermission(){modal('VPN 连接授权','<p>允许建立所选地区的 VPN 连接？</p>',[['暂不开启',vpnPermissionFailed],['允许',()=>{allowed=true;start()},true]])}
function vpnPermissionFailed(){setState('idle');modal('未获得 VPN 权限','<p>连接尚未开始。授权后即可继续使用所选地区。</p>',[['返回首页',()=>{adSeen=false;close()}],['重新授权',requestVpnPermission,true]])}
function haloRegionMarkup(){return haloRegions.map(r=>'<div class="countryGroup"><button class="countryHead" data-country="'+r.country+'" aria-expanded="false"><span class="countryFlag">'+regionFlag(r.flag)+'</span><span class="countryName">'+r.country+'</span><span class="countryCount">'+r.nodes.length+' 个节点</span><span class="countryArrow">⌄</span></button><div class="countryNodes" hidden>'+r.nodes.map(n=>'<button data-halo-node="'+n.name+'" data-flag="'+r.flag+'" class="'+(server.name===n.name?'selected':'')+'"><span>'+n.city+'</span><small>'+n.ms+' ms · 可用</small></button>').join('')+'</div></div>').join('')}
function bindHaloRegions(root,onSelect){root.querySelectorAll('[data-country]').forEach(head=>head.onclick=()=>{const panel=head.nextElementSibling;panel.hidden=!panel.hidden;head.setAttribute('aria-expanded',String(!panel.hidden))});root.querySelectorAll('[data-halo-node]').forEach(button=>button.onclick=()=>onSelect(button.dataset.haloNode,button.dataset.flag))}
function selectHaloNode(name,flag){if(state==='connecting')return;const wasConnected=state==='connected';if(wasConnected&&server.name===name){haloHome();return}if(wasConnected)saveChannelHistory();server={name,flag};regionConfirmed=true;try{localStorage.setItem('halo.selectedRegion',name)}catch(e){};$('server').textContent=name;$('flag').textContent=flag;haloHome();if(wasConnected||state==='failed')start()}
function choose(){if(state==='connecting')return;modal('选择连接节点','<div class="list">'+haloRegionMarkup()+'</div>',[['返回',close]]);bindHaloRegions($('sheetBody'),selectHaloNode)}
const originalConnect=$('connect').onclick=()=>{if(state==='connecting')return;if(state==='connected'){close();saveHistory({flag:server.flag,node:server.name,when:new Date().toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'}),duration:format(seconds),result:'已结束'});clearTimers();remaining=5400;haloDeadline=0;$('remaining').textContent='90:00';adSeen=false;seconds=0;setState('idle');return}if(!adSeen){start();return}if(!allowed)requestVpnPermission();else start()};$('serverBtn').onclick=choose;$('menu').onclick=()=>{modal('Halo 设置','<p>轻量使用：免注册、全局路由、不限流量；每次可连接 90 分钟。连接成功后展示广告；已连接时可直接切换通道。</p><div class="list"><button class="server" id="lang">语言 · English</button><button class="server" id="logs">日志上报 · 不提供</button></div>',[['关闭',close]]);document.getElementById('lang').onclick=()=>{document.getElementById('lang').textContent='语言 · English（）'};document.getElementById('logs').onclick=()=>{document.getElementById('logs').textContent='日志上报 · 不提供'}};$('expire').onclick=()=>{remaining=0;$('remaining').textContent='00:00';clearTimers();adSeen=false;setState('idle');modal('本次时长已用完','<p>本次 90 分钟免费连接时长已用完，已断开连接。</p>',[['知道了',()=>{close();remaining=5400;haloDeadline=0;$('remaining').textContent='90:00';seconds=0},true]])};$('simulateFail').onclick=()=>{failNext=true;if(state==='connected'){clearTimers();setState('idle')}regionConfirmed=true;start()};$('reset').onclick=()=>{localHistory=[];try{localStorage.removeItem('halo.connectionHistory')}catch(e){};Object.keys(haloAttempts).forEach(k=>delete haloAttempts[k]);server={name:'',flag:'🏳️'};try{localStorage.removeItem('halo.selectedRegion')}catch(e){};$('server').textContent='请选择地区';$('flag').textContent=server.flag;notificationAsked=false;clearTimers();remaining=5400;haloDeadline=0;$('remaining').textContent='90:00';allowed=false;failNext=false;adSeen=false;regionConfirmed=false;seconds=0;close();setState('idle')};setState('idle');

// 首页的中央连接按钮先让用户选择地区，再进入授权和连接。
function chooseBeforeConnect(){
  if(remaining<=0){start();return}
  modal('先选一个连接地区','<div class="list">'+haloRegionMarkup()+'</div>',[['取消',close]]);
  bindHaloRegions($('sheetBody'),(name,flag)=>{server={name,flag};regionConfirmed=true;try{localStorage.setItem('halo.selectedRegion',name)}catch(e){};$('server').textContent=name;$('flag').textContent=flag;close();originalConnect()});
}
$('connect').onclick=()=>state==='connected'?originalConnect():regionConfirmed?originalConnect():chooseBeforeConnect();
$('homeTab').onclick=()=>{close();$('connect').focus()};
$('nodeTab').onclick=choose;
$('historyTab').onclick=()=>modal('本机连接记录','<p>今天已连接 '+format(seconds)+'，本次剩余 '+format(remaining)+'。连接历史仅保存在本机。</p>',[['返回首页',close,true]]);
$('settingsTab').onclick=$('menu').onclick;

let haloLang='English';
function haloDetail(title,html){$('detailPage').classList.toggle('haloSettingsPage',title==='我的');$('detailTitle').textContent=title;$('detailContent').innerHTML=html;$('detailPage').hidden=false}
function haloHome(){ $('detailPage').hidden=true;close() }
$('detailBack').onclick=haloHome;$('homeTab').onclick=haloHome;
$('nodeTab').onclick=()=>{haloDetail('选择连接地区','<div class="detailList">'+haloRegionMarkup()+'</div>');bindHaloRegions($('detailContent'),selectHaloNode)};
let localHistory=[];
try{localHistory=JSON.parse(localStorage.getItem('halo.connectionHistory')||'[]')}catch(e){localHistory=[]}
function saveHistory(item){localHistory.unshift(item);localHistory=localHistory.slice(0,20);try{localStorage.setItem('halo.connectionHistory',JSON.stringify(localHistory))}catch(e){}}
function showHistory(){let cards=localHistory.map(item=>'<div class="historyCard"><div class="historyTop"><span class="historyFlag">'+item.flag+'</span><div><strong>'+item.node+'</strong><small>'+item.when+'</small></div></div><div class="historyDuration">'+item.duration+'</div><span class="historyBadge">'+item.result+'</span></div>').join('');if(state==='connected')cards='<div class="historyCard"><div class="historyTop"><span class="historyFlag">'+server.flag+'</span><div><strong>'+server.name+'</strong><small>当前连接</small></div></div><div class="historyDuration">'+format(seconds)+'</div><span class="historyBadge">连接中</span></div>'+cards;haloDetail('连接记录','<p class="historyLead">最近连接</p>'+(cards||'<div class="historyEmpty">暂无连接记录</div>'))}
$('historyTab').onclick=showHistory;
let haloTheme='跟随系统';
function haloSettings(){haloDetail('我的','<p class="detailSection">通用</p><div class="detailList"><button id="haloLanguage">语言<small>'+haloLang+'</small></button><button id="haloTheme">主题<small>'+haloTheme+'</small></button></div><p class="detailSection">支持与隐私</p><div class="detailList"><button id="haloPrivacy">隐私政策<small>查看详情</small></button><button id="haloTerms">服务条款<small>查看详情</small></button></div><p class="haloVersion">版本号 1.0.0</p>');$('haloLanguage').onclick=()=>haloSelect('语言',[['English（唯一语言）',()=>haloLang='English']]);$('haloTheme').onclick=()=>haloSelect('主题',[['跟随系统',()=>haloTheme='跟随系统'],['浅色',()=>haloTheme='浅色'],['深色',()=>haloTheme='深色']],()=>phone.classList.toggle('haloDark',haloTheme==='深色'));$('haloPrivacy').onclick=()=>haloSub('隐私政策 · 详情','<p>不记录访问网站，连接状态仅用于本机显示。</p>');$('haloTerms').onclick=()=>haloSub('服务条款 · 详情','<p>服务条款内容。</p>')}
function haloSub(title,body){haloDetail(title,'<div class="detailCard">'+body+'</div>')}
function haloSelect(title,items,after){haloDetail(title,'<div class="detailList">'+items.map(([label],i)=>'<button data-halo-option="'+i+'">'+label+'</button>').join('')+'</div>');document.querySelectorAll('[data-halo-option]').forEach(b=>b.onclick=()=>{items[+b.dataset.haloOption][1]();after?.();haloSettings()})}
function haloContact(){haloDetail('联系我们','<p class="detailLead"></p><form id="haloFeedback"><label>反馈内容<textarea required minlength="3" rows="5" style="width:100%;margin-top:8px;border:1px solid #cbdff4;border-radius:12px;padding:12px;font:inherit"></textarea></label><button class="detailAction primary" type="submit">提交反馈</button></form>');$('haloFeedback').onsubmit=e=>{e.preventDefault();haloSub('反馈已记录','<p>感谢你的反馈。</p>')}}
$('settingsTab').onclick=haloSettings;
$('serverBtn').onclick=$('nodeTab').onclick;
$('menu').onclick=haloSettings;

function askLaunchNotification(force=false){if(notificationAsked&&!force)return;notificationAsked=true;modal('通知权限','<p>接收连接状态通知</p>',[['暂不开启',()=>modal('通知未开启','<p>连接状态仍可在首页查看。</p>',[['继续使用',close],['重新申请',()=>askLaunchNotification(true),true]])],['允许通知',close,true]])}
setTimeout(askLaunchNotification,450);
