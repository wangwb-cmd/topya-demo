.review{display:none!important}.layout{display:block;padding:0}.phone{margin:0 auto}.accountChip{font-size:11px}.adSlot{height:104px;border:1px solid #e6b1bd;border-radius:16px;background:repeating-linear-gradient(135deg,#fff7f5,#fff7f5 10px,#ffecef 10px,#ffecef 20px);display:grid;place-items:center;color:#a44a68}.adSlot span{font-size:11px}.adSlot strong{font-size:18px;letter-spacing:.2em}.adSlot small{font-size:11px}.regionChoice{display:flex!important;justify-content:space-between;align-items:center}.regionChoice.selected{background:#f8d7dc!important;border-color:#d45178!important}.fieldError{color:#bd4866;font-size:12px}.pulseDetail .box p{margin:6px 0}.pulseDetail form label{display:block;margin:10px 0}.pulseDetail textarea{width:100%;border:1px solid #e5b6bf;border-radius:10px;padding:10px;font:inherit}.phone[data-state=idle] .diagnoseAction{background:#c9cdd2!important;color:#525963!important;box-shadow:none!important}.phone[data-state=failed] .diagnoseAction{background:#c9cdd2!important;color:#525963!important}.phone[data-state=connecting] .diagnoseAction{background:#e7a15e!important;color:#fff!important}.phone[data-state=connected] .diagnoseAction{background:#d45178!important;color:#fff!important}.routeChoices{display:grid;margin-top:24px;background:#fffaf6;border:1px solid #e6b5bd;border-radius:20px;overflow:hidden}.routeChoice{display:flex;align-items:center;gap:14px;width:100%;min-height:105px;padding:18px 16px;border:0;border-bottom:1px solid #e6b5bd;background:transparent;color:#642d46;text-align:left;font:inherit}.routeChoice:last-child{border-bottom:0}.routeIcon{font-size:28px;width:36px;text-align:center}.routeCopy{display:grid;gap:8px;flex:1}.routeCopy strong{font-size:18px}.routeCopy small{font-size:12px;line-height:1.5;color:#a1707d}.routeCheck{display:grid;place-items:center;flex:0 0 27px;height:27px;border:2px solid #a1707d;border-radius:50%;color:#fff}.routeChoice[aria-checked=true] .routeCheck{background:#3f83ee;border-color:#3f83ee}</style></head><body><div class="layout"><main class="phone" id="phone" data-state="idle"><div class="statusbar"><span>9:41</span><span>●●● ▰</span></div><header class="top"><div class="logo">pulse<span>.</span></div><button id="info" aria-label="打开设置">☷</button></header><section class="greeting"><h1 id="title">选择地区，开始连接</h1><p id="desc">请选择连接地区</p></section><section class="hero"><div class="label">线路状态</div><h2 id="heroTitle">准备就绪</h2><p id="heroDesc">选择地区后开始连接。</p><div class="quality"><i></i><i></i><i></i><i></i></div><span class="badge" id="badge">待连接</span></section><div class="accountChip" id="accountChip">不限时 · 不限流量</div><button class="diagToggle" id="diagToggle">选择地区 ›</button><div class="section"><strong>当前地区</strong><span id="selectionNote">未选择</span></div><div class="candidates" id="candidates"><button class="candidate" data-city="新加坡" data-flag="🇸🇬" data-ms="42"><span class="flag">🇸🇬</span><span><strong>新加坡</strong><small>稳定 · 42 ms</small></span><span class="score">可选</span></button><button class="candidate" data-city="日本 · 东京" data-flag="🇯🇵" data-ms="68"><span class="flag">🇯🇵</span><span><strong>日本 · 东京</strong><small>稳定 · 68 ms</small></span><span class="score">可选</span></button><button class="candidate" data-city="美国 · 洛杉矶" data-flag="🇺🇸" data-ms="126"><span class="flag">🇺🇸</span><span><strong>美国 · 洛杉矶</strong><small>可用 · 126 ms</small></span><span class="score">可选</span></button></div><div class="bottom"><button class="primary diagnoseAction" id="mainBtn"><span>⏻</span> 选择地区并连接</button><p class="hint" id="hint"></p></div><div class="rightShade" id="rightShade"><aside class="rightDrawer" role="dialog" aria-modal="true" aria-label="Pulse 设置抽屉"><button class="drawerBack" id="rightClose" aria-label="返回诊断首页">‹</button><h2>诊断中心</h2><p>路由与线路设置</p><button id="rightLang">语言：简体中文</button><button id="rightMode">保护模式：标准</button><button id="rightRoute">路由范围：智能路由</button><button id="rightLog">本机日志</button><button id="rightPolicy">隐私政策</button><button id="rightTerms">服务条款</button><button id="rightAbout">关于</button></aside></div><section id="pulseDetail" class="pulseDetail" hidden><header><button id="pulseBack" aria-label="返回诊断首页">‹</button><h2 id="pulseTitle"></h2></header><div id="pulseContent"></div></section><div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions" id="modalActions"></div></div></div></main></div><script>const $ = id => document.getElementById(id);
const phone = $('phone');
let state = 'idle';
let selected = '';
let language = 'English';
let protection = '标准';
let route = '智能路由';
let favorite = '';
let adSeen = false;
let vpnAllowed = false;
let pendingConnect = false;
let seconds = 0;
let lastError = '';
let logSubmitted = false;
let notificationAsked = false;
let backTarget = 'home';
let clock = null;
let timers = [];
const attempts = {};
const nodeData = [
  {city:'新加坡', flag:'🇸🇬', ms:42, sort:10, quality:'稳定'},
  {city:'日本 · 东京', flag:'🇯🇵', ms:68, sort:20, quality:'稳定'},
  {city:'美国 · 洛杉矶', flag:'🇺🇸', ms:126, sort:30, quality:'可用'}
];
nodeData.sort((a,b)=>a.sort-b.sort||(a.city<b.city?-1:a.city>b.city?1:0));
selected=nodeData[0]?.city||'';try{const remembered=localStorage.getItem('pulse.selectedRegion');if(nodeData.some(n=>n.city===remembered))selected=remembered}catch(e){}
const languages = ['English','فارسی','Türkmençe','မြန်မာဘာသာ','Русский'];

function stopTimers(){timers.forEach(clearTimeout);timers=[];clearInterval(clock);clock=null}
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function format(v){return String(Math.floor(v/3600)).padStart(2,'0')+':'+String(Math.floor(v%3600/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}
function closeModal(){$('overlay').classList.remove('show')}
function modal(title,html,actions){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalActions').replaceChildren();for(const [label,fn,primary] of actions){const button=document.createElement('button');button.textContent=label;button.className=primary?'yes':'';button.onclick=fn;$('modalActions').append(button)}$('overlay').classList.add('show')}
function syncState(next){state=next;phone.dataset.state=next;const data={
  idle:['未连接','选择地区后开始','待连接','—',selected?'连接当前地区':'选择地区并连接'],
  connecting:['正在连接',selected,'建立通道中','正在与线路建立连接','连接中…'],
  connected:['已连接',selected,'连接安全',selected+' · 连接时长 '+format(seconds),'断开连接'],
  failed:['连接失败',selected,'线路无响应',lastError||'请重试或更换地区','重试连接']
}[next];$('title').textContent=data[0];$('desc').textContent=data[1];$('heroTitle').textContent=data[2];$('heroDesc').textContent=data[3];$('badge').textContent=next==='connected'?'已保护':next==='failed'?'需处理':next==='idle'?'未连接':'进行中';$('mainBtn').innerHTML='<span>⏻</span> '+data[4];$('mainBtn').disabled=next==='connecting';$('diagToggle').disabled=next==='connecting';$('selectionNote').textContent=selected||'未选择';$('accountChip').textContent='不限时 · 不限流量';$('hint').textContent=next==='connected'?'已连接 '+format(seconds):'';$('rightLog').textContent='本机日志';$('rightLang').textContent='语言：'+language}
function openDrawer(){$('rightShade').classList.add('show')}
function closeDrawer(){$('rightShade').classList.remove('show')}
function openPage(title,html,back='drawer'){backTarget=back;closeDrawer();$('pulseTitle').textContent=title;$('pulseContent').innerHTML=html;$('pulseDetail').hidden=false}
function closePage(){$('pulseDetail').hidden=true;if(backTarget==='drawer')openDrawer()}


function regionPage(){
  const cards=nodeData.map(n=>'<button class="option regionChoice '+(selected===n.city?'selected':'')+'" data-city="'+n.city+'"><span>'+n.flag+'　'+n.city+'</span><small>'+n.ms+' ms · '+n.quality+'</small></button>').join('');
  const summary=selected?'<div class="box"><h3>已选 · '+selected+'</h3></div><button class="option primary" id="connectSelected">连接此地区</button>':'<div class="box"><h3>请选择地区</h3></div>';
  openPage('选择地区',cards+summary,'home');
  document.querySelectorAll('.regionChoice').forEach(button=>button.onclick=()=>{if(state==='connected'||state==='connecting'){modal('请先断开','<p>当前连接中无法更换地区。</p>',[['知道了',closeModal,true]]);return}selected=button.dataset.city;try{localStorage.setItem('pulse.selectedRegion',selected)}catch(e){};syncState(state==='failed'?'idle':state);regionPage()});
  if(selected)$('connectSelected').onclick=()=>{$('pulseDetail').hidden=true;beginConnection()}
}
function beginConnection(){if(state==='connected'){disconnect();return}if(state==='connecting')return;if(!selected){regionPage();return}if(!notificationAsked){requestNotification();return}beginConnectionCore()}
function requestNotification(){notificationAsked=true;modal('通知权限','<p>接收连接状态通知</p>',[['暂不开启',()=>modal('通知未开启','<p>不影响本次连接。</p>',[['返回首页',closeModal],['继续连接',beginConnectionCore],['重新申请',requestNotification,true]])],['允许通知',beginConnectionCore,true]])}
function beginConnectionCore(){requestVpnPermission()}

function requestVpnPermission(){if(vpnAllowed){connectNow();return}modal('VPN 连接授权','<p>允许创建 VPN 连接？</p>',[['暂不开启',()=>{syncState('idle');modal('VPN 权限未开启','<p>'+selected+' 尚未连接。</p>',[['返回首页',()=>{adSeen=false;closeModal()}],['重新授权',requestVpnPermission,true]])}],['允许',()=>{vpnAllowed=true;closeModal();connectNow()},true]])}
function connectNow(){closeModal();stopTimers();syncState('connecting');attempts[selected]=(attempts[selected]||0)+1;later(()=>{if(selected==='美国 · 洛杉矶'&&attempts[selected]===1){lastError='连接超时';syncState('failed');modal('连接失败','<p>'+selected+' · 连接超时</p>',[['返回首页',()=>{adSeen=false;closeModal()}],['更换地区',()=>{closeModal();regionPage()}],['重试',()=>{closeModal();beginConnection()},true]]);return}lastError='';seconds=0;syncState('connected');modal('连接成功后广告','<div class="adSlot"><span>广告</span><strong>PULSE</strong><small>安全连接，随时启程</small></div>',[['关闭广告',closeModal,true]]);clock=setInterval(()=>{seconds++;$('heroDesc').textContent=selected+' · 连接时长 '+format(seconds);$('hint').textContent='已连接 '+format(seconds)},1000)},1200)}
function disconnect(){closeModal();stopTimers();adSeen=false;syncState('idle')}

function languagesPage(){openPage('语言选择',languages.map(x=>'<button class="option" data-language="'+x+'">'+x+(language===x?'　✓':'')+'</button>').join(''));document.querySelectorAll('[data-language]').forEach(b=>b.onclick=()=>{language=b.dataset.language;$('rightLang').textContent='语言：'+language;languagesPage()})}
function protectionPage(){openPage('保护模式',['标准','严格'].map(x=>'<button class="option" data-protection="'+x+'">'+x+(protection===x?'　✓':'')+'</button>').join('')+'<div class="box"><small>'+(protection==='严格'?'连接中断时阻断网络':'连接中断时恢复普通网络')+'</small></div>');document.querySelectorAll('[data-protection]').forEach(b=>b.onclick=()=>{protection=b.dataset.protection;$('rightMode').textContent='保护模式：'+protection;protectionPage()})}
function routePage(){openPage('路由模式','<div class="routeChoices" role="radiogroup" aria-label="路由模式">'+[['智能路由','ϟ','本地网络与 VPN 网络共存，智能选择最合适的网络。'],['全局路由','◎','所有流量均通过 VPN 服务器，确保最大的隐私和安全。']].map(([name,icon,desc])=>'<button class="routeChoice" role="radio" aria-checked="'+(route===name)+'" data-route="'+name+'"><span class="routeIcon">'+icon+'</span><span class="routeCopy"><strong>'+name+'</strong><small>'+desc+'</small></span><span class="routeCheck">'+(route===name?'✓':'')+'</span></button>').join('')+'</div>');document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{route=b.dataset.route;$('rightRoute').textContent='路由范围：'+route;routePage()})}
function logPage(){openPage('本机日志','<div class="box"><h3>最近状态</h3><small>'+({idle:'未连接',connecting:'连接中',connected:'已连接',failed:'连接失败'}[state])+(selected?' · '+selected:'')+'</small></div><div class="box"><h3>错误上报</h3><small>'+(lastError||'暂无错误')+'</small></div><button class="option" id="sendError">'+(logSubmitted?'已上报':'上报错误')+'</button>');$('sendError').onclick=()=>{if(!lastError){modal('暂无错误','<p>当前没有可上报的连接错误。</p>',[['知道了',closeModal,true]]);return}modal('上报错误？','<p>仅上报错误码与线路，不包含访问历史。</p>',[['取消',closeModal],['同意上报',()=>{logSubmitted=true;lastError='';closeModal();logPage()},true]])}}
function infoPage(title,content){openPage(title,'<div class="box">'+content+'</div>')}

$('mainBtn').onclick=()=>state==='connected'?disconnect():state==='failed'?beginConnection():selected?beginConnection():regionPage();
$('diagToggle').onclick=regionPage;
$('info').onclick=openDrawer;
$('rightClose').onclick=closeDrawer;
$('rightShade').onclick=e=>{if(e.target===$('rightShade'))closeDrawer()};
$('pulseBack').onclick=closePage;
$('rightLang').onclick=languagesPage;
$('rightMode').onclick=protectionPage;
$('rightRoute').onclick=routePage;


$('rightLog').onclick=logPage;
$('rightLog').textContent='本机日志';


$('rightPolicy').onclick=()=>infoPage('隐私政策','<h3>连接数据</h3><p>不记录访问过的网站。错误信息只在你主动上报时使用。</p>');
$('rightTerms').onclick=()=>infoPage('服务条款','<h3>服务使用</h3><p>请遵守当地法律及服务规则。连接可随时断开。</p>');
$('rightAbout').onclick=()=>infoPage('关于 Pulse','<h3>Pulse VPN</h3><p>版本 1.0</p>');
syncState('idle');
</script></body></html>
