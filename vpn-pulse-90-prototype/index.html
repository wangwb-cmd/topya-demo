const nodeData = [
  {country:'新加坡',city:'新加坡', flag:'🇸🇬', ms:42, sort:10, quality:'稳定'},
  {country:'日本',city:'日本 · 东京', flag:'🇯🇵', ms:68, sort:20, quality:'稳定'},
  {country:'日本',city:'日本 · 大阪', flag:'🇯🇵', ms:74, sort:21, quality:'稳定'},
  {country:'美国',city:'美国 · 洛杉矶', flag:'🇺🇸', ms:126, sort:30, quality:'可用'}
];
nodeData.sort((a,b)=>a.sort-b.sort||(a.city<b.city?-1:a.city>b.city?1:0));
selected=nodeData[0]?.city||'';try{const remembered=localStorage.getItem('pulse.selectedRegion');if(nodeData.some(n=>n.city===remembered))selected=remembered}catch(e){}
const languages = ['English','فارسی','Türkmençe','မြန်မာဘာသာ','Русский'];

function stopTimers(){timers.forEach(clearTimeout);timers=[];clearInterval(clock);clock=null}
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function format(v){return String(Math.floor(v/3600)).padStart(2,'0')+':'+String(Math.floor(v%3600/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}
function closeModal(){$('overlay').classList.remove('show')}
function modal(title,html,actions){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalActions').replaceChildren();for(const [label,fn,primary] of actions){const button=document.createElement('button');button.textContent=label;button.className=primary?'yes':'';button.onclick=fn;$('modalActions').append(button)}$('overlay').classList.add('show')}
function syncState(next){state=next;phone.dataset.state=next;const data={
  idle:['未连接','选择地区后开始','待连接','—',selected?'连接当前地区':'选择地区并连接'],
  connecting:['正在连接',selected,'建立通道中','正在与线路建立连接','连接中…'],
  connected:['已连接',connectedNode||selected,'连接安全',(connectedNode||selected)+' · 连接时长 '+format(seconds),'断开连接'],
  failed:['连接失败',selected,'线路无响应',lastError||'请重试或更换地区','重试连接']
}[next];$('title').textContent=data[0];$('desc').textContent=data[1];$('heroTitle').textContent=data[2];$('heroDesc').textContent=data[3];$('badge').textContent=next==='connected'?'已保护':next==='failed'?'需处理':next==='idle'?'未连接':'进行中';$('mainBtn').innerHTML='<span>⏻</span> '+data[4];$('mainBtn').disabled=next==='connecting';$('diagToggle').disabled=next==='connecting';$('selectionNote').textContent=selected||'未选择';updateRemaining();$('hint').textContent=next==='connected'?'已连接 '+format(seconds):'';$('rightLog').textContent='本机日志';$('rightLang').textContent='语言：'+language}
function openDrawer(){$('rightShade').classList.add('show')}
function closeDrawer(){$('rightShade').classList.remove('show')}
function openPage(title,html,back='drawer'){backTarget=back;closeDrawer();$('pulseTitle').textContent=title;$('pulseContent').innerHTML=html;$('pulseDetail').hidden=false}
function closePage(){$('pulseDetail').hidden=true;if(backTarget==='drawer')openDrawer()}


const pulseExpanded=new Set();
function regionPage(){
  const groups=new Map();nodeData.forEach(n=>{if(!groups.has(n.country))groups.set(n.country,[]);groups.get(n.country).push(n)});
  const cards=[...groups].map(([country,nodes])=>'<div class="countryGroup"><button class="countryHead" data-country="'+country+'" aria-expanded="'+pulseExpanded.has(country)+'"><span class="countryFlag">'+regionFlag(nodes[0].flag)+'</span><span class="countryName">'+country+'</span><span class="countryCount">'+nodes.length+' 个节点</span><span>⌄</span></button><div class="countryNodes" '+(pulseExpanded.has(country)?'':'hidden')+'>'+nodes.map(n=>'<button class="option regionChoice '+(selected===n.city?'selected':'')+'" data-city="'+n.city+'"><span>'+n.city.replace(country+' · ','')+'</span><small>'+n.ms+' ms · '+n.quality+'</small></button>').join('')+'</div></div>').join('');
  const summary=selected?'<div class="box"><h3>已选 · '+selected+'</h3></div><button class="option primary" id="connectSelected">'+(state==='connected'?'切换到此地区':'连接此地区')+'</button>':'<div class="box"><h3>请选择地区</h3></div>';
  openPage('选择地区',cards+summary,'home');
  $('pulseContent').querySelectorAll('[data-country]').forEach(head=>head.onclick=()=>{const panel=head.nextElementSibling;panel.hidden=!panel.hidden;head.setAttribute('aria-expanded',String(!panel.hidden));if(panel.hidden)pulseExpanded.delete(head.dataset.country);else pulseExpanded.add(head.dataset.country)});
  document.querySelectorAll('.regionChoice').forEach(button=>button.onclick=()=>{if(state==='connecting')return;selected=button.dataset.city;try{localStorage.setItem('pulse.selectedRegion',selected)}catch(e){};syncState(state==='failed'?'idle':state);regionPage()});
  if(selected)$('connectSelected').onclick=()=>{if(state==='connected'&&selected===connectedNode){$('pulseDetail').hidden=true;return}$('pulseDetail').hidden=true;beginConnection()}
}
function beginConnection(){if(state==='connecting')return;if(state==='connected'&&selected===connectedNode)return;if(!selected){regionPage();return}if(!notificationAsked){requestNotification();return}beginConnectionCore()}
function requestNotification(){notificationAsked=true;modal('通知权限','<p>接收连接状态通知</p>',[['暂不开启',()=>modal('通知未开启','<p>不影响本次连接。</p>',[['返回首页',closeModal],['继续连接',beginConnectionCore],['重新申请',requestNotification,true]])],['允许通知',beginConnectionCore,true]])}
function beginConnectionCore(){requestVpnPermission()}

function requestVpnPermission(){if(vpnAllowed){connectNow();return}modal('VPN 连接授权','<p>允许创建 VPN 连接？</p>',[['暂不开启',()=>{syncState('idle');modal('VPN 权限未开启','<p>'+selected+' 尚未连接。</p>',[['返回首页',()=>{adSeen=false;closeModal()}],['重新授权',requestVpnPermission,true]])}],['允许',()=>{vpnAllowed=true;closeModal();connectNow()},true]])}
function connectNow(){closeModal();stopTimers();updateRemaining();if(sessionDeadline&&remaining===0){expireSession();return}syncState('connecting');attempts[selected]=(attempts[selected]||0)+1;later(()=>{if(selected==='美国 · 洛杉矶'&&attempts[selected]===1){lastError='连接超时';syncState('failed');modal('连接失败','<p>'+selected+' · 连接超时</p>',[['返回首页',()=>{adSeen=false;closeModal()}],['更换地区',()=>{closeModal();regionPage()}],['重试',()=>{closeModal();beginConnection()},true]]);return}lastError='';if(!sessionDeadline){remaining=5400;sessionDeadline=Date.now()+5400000;seconds=0}connectedNode=selected;updateRemaining();if(remaining===0){expireSession();return}syncState('connected');modal('连接成功后广告','<div class="adSlot"><span>广告</span><strong>PULSE</strong><small>安全连接，随时启程</small></div>',[['关闭广告',closeModal,true]]);clock=setInterval(()=>{seconds++;updateRemaining();if(remaining===0){expireSession();return}$('heroDesc').textContent=connectedNode+' · 连接时长 '+format(seconds);$('hint').textContent='已连接 '+format(seconds)},1000)},1200)}
function disconnect(){closeModal();stopTimers();adSeen=false;sessionDeadline=0;connectedNode='';remaining=5400;seconds=0;syncState('idle')}

function languagesPage(){openPage('语言选择',languages.map(x=>'<button class="option" data-language="'+x+'">'+x+(language===x?'　✓':'')+'</button>').join(''));document.querySelectorAll('[data-language]').forEach(b=>b.onclick=()=>{language=b.dataset.language;$('rightLang').textContent='语言：'+language;languagesPage()})}
function protectionPage(){openPage('保护模式',['标准','严格'].map(x=>'<button class="option" data-protection="'+x+'">'+x+(protection===x?'　✓':'')+'</button>').join('')+'<div class="box"><small>'+(protection==='严格'?'连接中断时阻断网络':'连接中断时恢复普通网络')+'</small></div>');document.querySelectorAll('[data-protection]').forEach(b=>b.onclick=()=>{protection=b.dataset.protection;$('rightMode').textContent='保护模式：'+protection;protectionPage()})}
function routePage(){openPage('路由模式','<div class="routeChoices" role="radiogroup" aria-label="路由模式">'+[['智能路由','ϟ','本地网络与 VPN 网络共存，智能选择最合适的网络。'],['全局路由','◎','所有流量均通过 VPN 服务器，确保最大的隐私和安全。']].map(([name,icon,desc])=>'<button class="routeChoice" role="radio" aria-checked="'+(route===name)+'" data-route="'+name+'"><span class="routeIcon">'+icon+'</span><span class="routeCopy"><strong>'+name+'</strong><small>'+desc+'</small></span><span class="routeCheck">'+(route===name?'✓':'')+'</span></button>').join('')+'</div>');document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{route=b.dataset.route;$('rightRoute').textContent='路由范围：'+route;routePage()})}
function logPage(){openPage('本机日志','<div class="box"><h3>最近状态</h3><small>'+({idle:'未连接',connecting:'连接中',connected:'已连接',failed:'连接失败'}[state])+(selected?' · '+selected:'')+'</small></div><div class="box"><h3>错误上报</h3><small>'+(lastError||'暂无错误')+'</small></div><button class="option" id="sendError">'+(logSubmitted?'已上报':'上报错误')+'</button>');$('sendError').onclick=()=>{if(!lastError){modal('暂无错误','<p>当前没有可上报的连接错误。</p>',[['知道了',closeModal,true]]);return}modal('上报错误？','<p>仅上报错误码与线路，不包含访问历史。</p>',[['取消',closeModal],['同意上报',()=>{logSubmitted=true;lastError='';closeModal();logPage()},true]])}}
function infoPage(title,content){openPage(title,'<div class="box">'+content+'</div>')}

$('mainBtn').onclick=()=>state==='connected'?disconnect():state==='failed'?beginConnection():selected?beginConnection():regionPage();
$('diagToggle').onclick=regionPage;
$('info').onclick=openDrawer;
$('rightClose').onclick=closeDrawer;
$('rightShade').onclick=e=>{if(e.target===$('rightShade'))closeDrawer()};
$('pulseBack').onclick=closePage;
$('rightLang').onclick=languagesPage;
$('rightMode').onclick=protectionPage;
$('rightRoute').onclick=routePage;


$('rightLog').onclick=logPage;
$('rightLog').textContent='本机日志';


$('rightPolicy').onclick=()=>infoPage('隐私政策','<h3>连接数据</h3><p>不记录访问过的网站。错误信息只在你主动上报时使用。</p>');
$('rightTerms').onclick=()=>infoPage('服务条款','<h3>服务使用</h3><p>请遵守当地法律及服务规则。连接可随时断开。</p>');
$('rightAbout').onclick=()=>infoPage('关于 Pulse','<h3>Pulse VPN</h3><p>版本 1.0</p>');
syncState('idle');
</script></body></html>
