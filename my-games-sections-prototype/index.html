<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的游戏分区展示 · 交互原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf0f3;color:#222;font-family:Arial,"Microsoft YaHei",sans-serif;letter-spacing:0}.workspace{max-width:980px;margin:24px auto;display:flex;gap:28px;align-items:flex-start;justify-content:center;padding:0 16px}.review{width:270px;background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:18px;flex:none}.review h2{font-size:17px;margin:0 0 15px}.review label{display:block;font-size:12px;color:#59616a;margin:16px 0 6px}.review select,.review button{width:100%;border:1px solid #cdd3d9;background:white;border-radius:6px;padding:10px;font:inherit}.review button{margin-top:10px;cursor:pointer}.review button:hover{border-color:#267ad5}.review p{font-size:12px;line-height:1.5;color:#69727c}.phone{width:390px;height:844px;flex:none;background:#0a0a0a;border:6px solid #202328;border-radius:34px;box-shadow:0 18px 48px #17212c33;overflow:hidden;position:relative;color:#fff}.phone::before{content:"";position:absolute;z-index:3;width:96px;height:22px;background:#202328;border-radius:0 0 15px 15px;left:50%;transform:translateX(-50%)}.status{height:39px;padding:9px 20px 0;font-size:12px;font-weight:bold;display:flex;justify-content:space-between}.brand{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.logo{font-size:24px;font-weight:900}.logo span{color:#f5c848}.brand button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}.screen{height:calc(100% - 39px - 54px - 67px);overflow-y:auto;scrollbar-width:none;padding:8px 16px 24px}.screen::-webkit-scrollbar{display:none}.section{margin-bottom:22px}.section h2{font-size:21px;margin:10px 0 15px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px 14px}.game{min-width:0;cursor:pointer}.cover{position:relative;aspect-ratio:1;overflow:hidden;border-radius:8px;background:#242424}.cover img{width:100%;height:100%;object-fit:cover;display:block}.cover::after{content:"";position:absolute;inset:65% 0 0;background:linear-gradient(transparent,#0008);pointer-events:none}.heart,.play{position:absolute;z-index:1;border:0;color:#fff;background:#151515c9;width:33px;height:33px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:21px}.heart{right:7px;top:7px}.heart.on{color:#ffc24b}.play{right:7px;bottom:7px;font-size:15px}.game-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:7px 2px 0}.empty{height:100%;min-height:350px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:10px;padding:0 28px}.empty img{width:96px;height:96px;object-fit:contain}.empty strong{font-size:22px}.empty span{font-size:16px;line-height:1.5;color:#888}.empty button{border:0;background:#fff;color:#101010;border-radius:5px;padding:9px 20px;font-size:14px;font-weight:bold;cursor:pointer;margin-top:8px}.bottom{position:absolute;bottom:0;left:0;right:0;height:67px;background:#111;border-top:1px solid #292929;display:grid;grid-template-columns:1fr 1fr}.bottom button{border:0;background:none;color:#aaa;font-size:13px;cursor:pointer}.bottom button.active{color:#f6c94f;font-weight:bold}.bottom .ico{display:block;font-size:21px;margin-bottom:3px}.toast{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);background:#252525;color:#fff;padding:9px 14px;border-radius:5px;white-space:nowrap;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.detail{padding:28px 10px}.detail img{width:100%;border-radius:8px;aspect-ratio:1;object-fit:cover}.detail h1{font-size:25px}.detail button{border:0;background:#f5c848;padding:12px 20px;border-radius:5px;font-weight:bold;cursor:pointer}.home-title{font-size:23px;margin:12px 0}.page-link{color:#d7dce2;font-size:13px}.tiled .workspace{margin-top:24px}@media(max-width:720px){.workspace{display:block;margin:0 auto;padding:0}.review{width:auto;border-radius:0;margin:0 0 14px}.phone{margin:auto;width:min(390px,100vw);height:min(844px,calc(100dvh - 200px));min-height:560px;border-radius:0;border-width:0}.phone::before{display:none}}@media print{.review{display:none}.phone{box-shadow:none}}
</style></head><body><div class="workspace"><aside class="review"><h2>评审场景</h2><label for="scenario">数据状态</label><select id="scenario"><option value="both">收藏与下载均有数据</option><option value="favorites">只有收藏</option><option value="downloads">只有下载</option><option value="none">均无数据</option></select><label for="days">有效游玩窗口</label><select id="days"><option value="3">近 3 天</option><option value="7">近 7 天</option></select><button id="reset">重置演示数据</button><p>点击游戏封面可查看进入游戏的示意；星标可收藏或取消收藏。场景控件仅供评审。</p></aside><div class="device-wrapper active"><div class="phone device" data-name="我的游戏分区" id="phone"><div class="status"><span>9:41</span><span>●●● 100%</span></div><div class="brand"><div class="logo">TOP<span>YA</span></div><button aria-label="设置" title="设置">⚙</button></div><main class="screen" id="screen"></main><nav class="bottom"><button data-nav="home"><span class="ico">⌂</span>Home</button><button data-nav="mine"><span class="ico">★</span>My Games</button></nav><div class="toast" id="toast"></div></div><div class="device-label" style="display:none">我的游戏分区</div></div></div>
<script>
(()=>{'use strict';
const base='assets/';
const catalog=[
 {id:9,name:'Blocky Blast Puzzle',cover:'9.jpg',favorite:true,downloaded:true,downloadAt:10,plays:[{day:1,durationSec:32,exit:'killed'}]},
 {id:39,name:'Level Devil',cover:'39.jpg',favorite:true,downloaded:false,downloadAt:0,plays:[]},
 {id:8,name:'Merge Zoo',cover:'8.jpg',favorite:false,downloaded:true,downloadAt:12,plays:[{day:2,durationSec:45,exit:'normal'}]},
 {id:80,name:'Drive Escape',cover:'80.jpg',favorite:false,downloaded:true,preDownloaded:true,downloadAt:14,plays:[{day:1,durationSec:12,exit:'normal'}]}
];
let games=structuredClone(catalog),page='mine',detail=null,scenario='both',days=3;
const screen=document.getElementById('screen'),toast=document.getElementById('toast');
function message(value){toast.textContent=value;toast.classList.add('show');clearTimeout(message.timer);message.timer=setTimeout(()=>toast.classList.remove('show'),2200)}
function visibleGames(){return games}
function card(g){return `<article class="game" data-open="${g.id}" tabindex="0"><div class="cover"><img src="${base+g.cover}" alt="${g.name}"><button class="heart ${g.favorite?'on':''}" data-favorite="${g.id}" aria-label="${g.favorite?'取消收藏':'收藏'} ${g.name}" title="${g.favorite?'取消收藏':'收藏'}">${g.favorite?'★':'☆'}</button><button class="play" data-open="${g.id}" aria-label="打开 ${g.name}" title="打开游戏">▶</button></div><p class="game-name">${g.name}</p></article>`}
function section(title,items,kind){return items.length?`<section class="section"><h2>${title}</h2><div class="grid">${items.map(card).join('')}</div></section>`:''}
function render(){const list=visibleGames(),favorites=list.filter(g=>g.favorite);const downloaded=list.filter(g=>g.downloaded&&!g.favorite).sort((a,b)=>{const recent=g=>Math.max(0,...g.plays.filter(p=>p.durationSec>=30&&p.day<=days).map(p=>days-p.day+1));return recent(b)-recent(a)||b.downloadAt-a.downloadAt||a.id-b.id});let html='';if(detail){const g=games.find(x=>x.id===detail);html=`<div class="detail"><button data-back>← 返回</button><h1>${g.name}</h1><img src="${base+g.cover}" alt="${g.name}"><p class="page-link">游戏进入流程示意</p><button data-play="${g.id}">开始游戏</button></div>`}else if(page==='home'){html=`<h1 class="home-title">Discover Games</h1><div class="grid">${list.map(card).join('')}</div>`}else{html=section('我的收藏',favorites,'favorite')+section('已下载的游戏',downloaded,'download');if(!favorites.length&&!downloaded.length)html='<div class="empty"><img src="assets/empty.png" alt=""><strong>还没有游戏</strong><span>将喜欢的游戏添加到这里，方便快速访问。</span><button data-home>添加游戏</button></div>'}screen.innerHTML=html;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));if(['#none','#favorites','#downloads','#both'].includes(location.hash)){document.getElementById('scenario').value=scenario}}
function setScenario(s){scenario=s;games=structuredClone(catalog).map(g=>({...g,favorite:!['downloads','none'].includes(s)&&g.favorite,downloaded:!['favorites','none'].includes(s)&&g.downloaded}));detail=null;page='mine';render()}
document.getElementById('scenario').onchange=e=>{setScenario(e.target.value);history.replaceState(null,'','#'+e.target.value)};document.getElementById('days').onchange=e=>{days=Number(e.target.value);render()};document.getElementById('reset').onclick=()=>{days=3;document.getElementById('days').value='3';document.getElementById('scenario').value='both';setScenario('both');history.replaceState(null,'','#both')};
document.querySelector('.phone').addEventListener('click',e=>{let el=e.target.closest('[data-favorite],[data-open],[data-back],[data-home],[data-nav],[data-play]');if(!el)return;if(el.hasAttribute('data-favorite')){let g=games.find(x=>x.id===Number(el.dataset.favorite));g.favorite=!g.favorite;if(g.favorite){games=[g,...games.filter(x=>x.id!==g.id)]}message(g.favorite?'已收藏':'已取消收藏');render()}else if(el.hasAttribute('data-open')){detail=Number(el.dataset.open);render()}else if(el.hasAttribute('data-back')){detail=null;render()}else if(el.hasAttribute('data-home')){page='home';render()}else if(el.hasAttribute('data-nav')){page=el.dataset.nav;detail=null;render()}else if(el.hasAttribute('data-play')){message('游戏启动流程示意')}});
const initial=location.hash.slice(1);setScenario(['both','favorites','downloads','none'].includes(initial)?initial:'both');document.getElementById('scenario').value=scenario;
})();
</script></body></html>
